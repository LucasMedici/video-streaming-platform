<!DOCTYPE html>
<html>
<head>
    <title>Streamly</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/css/home.css">
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="logo">Streamly 🎬</div>

    <div class="actions">
        <button class="upload-btn" onclick="irUpload()">Upload</button>
        <button class="logout-btn" onclick="logout()">Sair</button>
    </div>
</div>

<!-- CONTENT -->
<div class="content">

    <h2>Para você</h2>

    <div id="grid" class="video-grid"></div>

</div>

<script>

    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    if(!token){
        window.location.href = "/login";
    }

    const isAdmin = role === "ROLE_ADMIN";

    // ESCONDE BOTÃO UPLOAD SE NÃO FOR ADMIN
    window.addEventListener("DOMContentLoaded", () => {
        if(!isAdmin){
            document.querySelector(".upload-btn").style.display = "none";
        }
    });

    function logout(){
        localStorage.removeItem("token");
        localStorage.removeItem("role");
        window.location.href = "/login";
    }

    function irUpload(){
        window.location.href = "/upload";
    }

    function abrirPlayer(video){
        window.location.href = `/watch/${video.id}`;
    }


    // DELETE VIDEO
    async function deletarVideo(id){

        const confirmacao = confirm("Deseja deletar este vídeo?");
        if(!confirmacao) return;

        const response = await fetch(`/videos/${id}`, {
            method: "DELETE",
            headers:{
                "Authorization": "Bearer " + token
            }
        });

        if(response.ok){
            carregarVideos();
        }else{
            const text = await response.text();
            alert("Erro ao deletar:\n" + text);
        }
    }


    // LOAD VIDEOS
    async function carregarVideos(){

        const response = await fetch("/videos", {
            headers:{
                "Authorization": "Bearer " + token
            }
        });

        if(!response.ok){
            alert("Erro ao carregar vídeos");
            return;
        }

        const videos = await response.json();
        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        videos.forEach(video => {

            const card = document.createElement("div");
            card.className = "video-card";
            card.onclick = () => abrirPlayer(video);

            // 🔥 DELETE SÓ SE ADMIN
            const deleteButton = isAdmin ? `
                <div class="delete-btn"
                     onclick="event.stopPropagation(); deletarVideo('${video.id}')">
                     🗑
                </div>
            ` : "";

            card.innerHTML = `
                <div class="thumb">
                    ${deleteButton}
                </div>

                <div class="title">
                    ${video.title}
                </div>

                <div class="desc">
                    ${video.description || ""}
                </div>

                <div class="duration">
                    ${video.durationSeconds || 0}s
                </div>
            `;

            grid.appendChild(card);
        });
    }

    carregarVideos();

</script>


</body>
</html>
